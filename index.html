<!DOCTYPE html>
<html lang="en" style="background-color: #f8f5ef;">
  <head>
    <meta name="theme-color" content="#f8f5ef" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/dfw_logo_3d.png" />
    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/assets/dfw_logo_3d.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Doug's Found Wood — Handcrafted Furniture from Athens, Maine</title>
    <meta name="description" content="Handcrafted furniture from Athens, Maine. Adirondack chairs, tables, and custom woodworking by Doug Malloy, built to last from cedar and hardwoods." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Boot wordmark — a hand-drawn SVG, rough from the first paint -->
    <link rel="preload" as="image" href="/boot-wordmark.svg">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Architects+Daughter&family=Patrick+Hand&family=Indie+Flower&family=Permanent+Marker&family=Shadows+Into+Light&display=swap" rel="stylesheet">
    <style>
      /* Static boot wordmark — a hand-drawn SVG that paints on the first
         frame, before the JS bundle loads. React's LoadingScreen renders the
         matching rough wordmark and then removes this node; both are
         hand-drawn, so the handoff has no crisp-to-rough flash. */
      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f5ef;
      }
      #boot-screen .boot-mark {
        display: block;
        width: clamp(18rem, 56vw, 31rem);
        height: auto;
      }
    </style>
  </head>
  <body style="background-color: #f8f5ef;">
    <div id="root"></div>
    <div id="boot-screen" aria-hidden="true"><img class="boot-mark" src="/boot-wordmark.svg" alt="" /></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
