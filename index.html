<!DOCTYPE html>
<html lang="en" style="background-color: #f8f5ef;">
  <head>
    <meta name="theme-color" content="#f8f5ef" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/dfw_logo_3d.png" />
    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/assets/dfw_logo_3d.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Doug's Found Wood — Handcrafted Furniture from Athens, Maine</title>
    <meta name="description" content="Handcrafted furniture from Athens, Maine. Adirondack chairs, tables, and custom woodworking by Doug Malloy, built to last from cedar and hardwoods." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preload the Caveat (latin) file so the instant boot wordmark renders in-brand fast -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/caveat/v23/Wnz6HAc5bAfYB2Q7ZjYY.woff2">
    <!-- Caveat uses display:block — the hero wordmark waits for the real font
         instead of flashing a mismatched fallback and resizing on swap. -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=block" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Architects+Daughter&family=Patrick+Hand&family=Indie+Flower&family=Permanent+Marker&family=Shadows+Into+Light&display=swap" rel="stylesheet">
    <style>
      /* Static boot wordmark — paints on the first frame, before the JS
         bundle loads. React's LoadingScreen renders an identical dead-centered
         wordmark and then removes this node, so the handoff is seamless. */
      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f5ef;
      }
      #boot-screen h1 {
        margin: 0;
        padding: 0 0.15em;
        font-family: "Caveat", cursive;
        font-weight: 400;
        font-size: clamp(2.75rem, 8.5vw, 4.75rem);
        line-height: 1;
        color: #5c4f3f;
        white-space: nowrap;
      }
    </style>
  </head>
  <body style="background-color: #f8f5ef;">
    <div id="root"></div>
    <div id="boot-screen" aria-hidden="true"><h1>Doug's Found Wood</h1></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
